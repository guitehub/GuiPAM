<dialog class="dialog w-full max-w-md">
  <article>
    <header>
      <h2 class="text-lg font-semibold">
        {% if account %}{{ _("Edit service account “%(name)s”", name=account.name) }}{% else %}{{ _("New service account") }}{% endif %}
      </h2>
    </header>
    <section>
      {% include "partials/_form_errors.html" %}
      <form class="form grid gap-4"
            {% if account %}hx-patch="/service-accounts/{{ account.id }}"{% else %}hx-post="/service-accounts"{% endif %}
            hx-target="#modal" hx-swap="innerHTML">
        <div class="grid gap-2">
          <label for="sa-name">{{ _("Name") }} *</label>
          <input type="text" id="sa-name" name="name" required autocomplete="off"
                 placeholder="ansible" value="{{ account.name if account else "" }}">
        </div>
        <div class="grid gap-2">
          <label for="sa-description">{{ _("Description") }}</label>
          <input type="text" id="sa-description" name="description" autocomplete="off"
                 value="{{ account.description or "" if account else "" }}">
        </div>
        <div class="grid gap-2">
          <label for="sa-role">{{ _("Role") }}</label>
          <select id="sa-role" name="role" class="select">
            <option value="user" {{ "selected" if not account or account.role.value == "user" }}>{{ _("user (read-only)") }}</option>
            <option value="manager" {{ "selected" if account and account.role.value == "manager" }}>{{ _("manager (read/write)") }}</option>
          </select>
          <p class="text-xs text-muted-foreground">{{ _("Only a manager account can hold read/write keys.") }}</p>
        </div>
        {% if account %}
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" class="checkbox" name="is_active" {{ "checked" if account.is_active }}>
          {{ _("Active account") }}
        </label>
        {% endif %}
        <footer class="flex justify-end gap-2">
          <button type="button" class="btn-outline" onclick="this.closest('dialog').close()">{{ _("Cancel") }}</button>
          <button type="submit" class="btn-primary">{% if account %}{{ _("Save") }}{% else %}{{ _("Create") }}{% endif %}</button>
        </footer>
      </form>
    </section>
  </article>
</dialog>
