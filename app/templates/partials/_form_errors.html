{# Toujours présent : sur une erreur 422, app.js ne remplace que ce bloc (la saisie est conservée). #}
<div data-form-errors data-error-fields="{{ (error_fields or []) | join(" ") }}">
{% if errors %}
<div class="alert-destructive mb-4" role="alert">
  <section>
    <ul class="list-disc pl-4 space-y-1">
      {% for error in errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  </section>
</div>
{% endif %}
</div>
