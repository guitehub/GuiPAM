{# Icônes SVG en ligne (tracés Lucide, licence ISC), couleur héritée du texte (currentColor).
   Usage : {% from "partials/_icons.html" import icon %} … {{ icon("pencil") }} #}
{% macro icon(name, cls="size-4") -%}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" class="{{ cls }}" aria-hidden="true" focusable="false">
{%- if name == "refresh" -%}
  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
{%- elif name == "pencil" -%}
  <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>
{%- elif name == "trash" -%}
  <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>
{%- elif name == "pause" -%}
  <rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>
{%- elif name == "play" -%}
  <polygon points="6 3 20 12 6 21 6 3"/>
{%- endif -%}
</svg>
{%- endmacro %}
