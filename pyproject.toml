[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guipam"
version = "0.3.1"
description = "IPAM auto-hébergé avec suivi dynamique de la vivacité des adresses IP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "jinja2==3.1.6",
    "sqlmodel==0.0.39",
    "aiosqlite==0.21.0",
    "alembic==1.15.2",
    "apscheduler==3.11.0",
    "bcrypt==4.3.0",
    "pydantic-settings==2.9.1",
    "babel==2.17.0",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
