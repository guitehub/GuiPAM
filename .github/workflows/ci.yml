# Tests à chaque push et pull request. Un tag vX.Y.Z ne devrait être posé que sur un commit vert :
# c'est lui qui déclenche le déploiement automatique sur evergreen.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Les catalogues .mo sont générés (gitignorés) : les tests i18n en ont besoin.
      - run: pybabel compile -d app/locale -D messages
      - run: pytest tests/ -q

  docker-build:
    # Vérifie que l'image se construit (sans la publier).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t guipam:ci .
